[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[project]
name = "contingency-dsl-e2e-roundtrip"
dynamic = ["version"]
description = "End-to-end roundtrip harness: paper -> reader -> DSL -> paper compiler -> paper, per procedure type."
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
dependencies = [
    "contingency-dsl-py>=0.1.1,<0.2",
    "contingency-procedure2dsl @ git+https://github.com/OperantKit/contingency-procedure2dsl.git@v0.1.0",
    "contingency-dsl2procedure @ git+https://github.com/OperantKit/contingency-dsl2procedure.git@v0.1.0",
    "pyyaml>=6",
    "pypdf>=4",
    "pymupdf>=1.24",
]

[project.optional-dependencies]
llm = ["anthropic>=0.40"]
test = ["pytest>=8"]

[project.scripts]
e2e = "contingency_dsl_e2e_roundtrip.cli:main"

[tool.hatch.version]
source = "vcs"
fallback-version = "0.0.0"

[tool.hatch.build.hooks.vcs]
version-file = "src/contingency_dsl_e2e_roundtrip/_version.py"

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["src/contingency_dsl_e2e_roundtrip"]

[tool.pytest.ini_options]
testpaths = ["tests"]
